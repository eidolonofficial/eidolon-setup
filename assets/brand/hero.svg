      <text x="38" y="-9" fill="#24383D">Reuse what is already known</text>
      <rect x="325" y="-27" width="22" height="22" rx="5" fill="#C77A46"/><path d="M331 -16l5 5 8-10" fill="none" stroke="#FFF9EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="363" y="-9" fill="#24383D">Ask only what matters</text>
