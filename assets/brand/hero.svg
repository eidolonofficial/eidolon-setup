      <text x="38" y="39" fill="#24383D">Choose skills from evidence</text>
      <rect x="325" y="21" width="22" height="22" rx="5" fill="#C77A46"/><path d="M331 32l5 5 8-10" fill="none" stroke="#FFF9EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="363" y="39" fill="#24383D">Verify before “done”</text>
