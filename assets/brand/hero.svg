<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Eidolon Setup</title><desc id="desc">Warm editorial banner for the Setup session skill.</desc>
