name: Apply current Claude instruction contract
on:
  push:
    branches: [release/current-claude-contract]
    paths: [.github/workflows/apply-current-contract.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/current-claude-contract
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply verified instruction changes
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          text=''
          data=base64.b64decode(text,validate=True)
          assert hashlib.sha256(data).hexdigest()=='bda632992c9431e9ab85e606da63b736f4816907ad91a89f459840efb67a27c9'
          p=pathlib.Path('/tmp/setup-contract.patch');p.write_bytes(lzma.decompress(data))
          subprocess.run(['git','apply','--check','--unidiff-zero',str(p)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(p)],check=True)
          PY
          node --test tests/*.test.mjs
          git rm .github/workflows/apply-current-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md codex references tests
          git commit -m 'docs: preserve model choice and current Claude tool semantics'
          git push origin HEAD:refs/heads/release/current-claude-contract
